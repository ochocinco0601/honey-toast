  - id: dfo-csharp-dbset
    languages: [csharp]
    severity: INFO
    message: "durable_write"
    metadata:
      fact_kind: durable_write
      # **EF Core writes were only read at `SaveChanges`.** That is one fact per unit of work,
      # so an estate doing ten different writes in a request reported one. The set operations
      # are what name what is written.
      authored: {estate: "fixtures — probe idioms", date: "2026-09-05", checked_against: "probe fixtures only"}
      checked:
        - {"estate": "eshop", "date": "2026-09-05", "sampled": 5, "correct": 5, "pattern_sha": "7134ce259571"}
    # **The receiver must be the context, not the set.** The first version constrained on the
    # set name with a trailing `s`, which is every plural identifier in C#. Measured on the
    # .NET reference estate: it produced 59 durable writes, of which the sampled majority were
    # `results.Add(...)`, `response.Items.Add(...)` and `GestureRecognizers.Add(...)` — list
    # operations on in-memory collections, filed as database writes. Naming the context is
    # what makes this a database fact; `Set<T>()` is the other spelling of the same thing.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $CTX.$SET.Add($E)
              - pattern: $CTX.$SET.AddAsync(...)
              - pattern: $CTX.$SET.AddRange(...)
              - pattern: $CTX.$SET.AddRangeAsync(...)
              - pattern: $CTX.$SET.Update($E)
              - pattern: $CTX.$SET.UpdateRange(...)
              - pattern: $CTX.$SET.Remove($E)
              - pattern: $CTX.$SET.RemoveRange(...)
          - metavariable-regex:
              metavariable: "$CTX"
              regex: '.*([Cc]ontext|[Dd]bContext|[Dd]b)$'
      - pattern: $CTX.Set<$T>().Add(...)
      - pattern: $CTX.Set<$T>().AddAsync(...)
      - pattern: $CTX.Set<$T>().Update(...)
      - pattern: $CTX.Set<$T>().Remove(...)

