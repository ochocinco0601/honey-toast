          - pattern-either:
              - pattern: $T.query(...)
              - pattern: $T.queryForObject(...)
              - pattern: $T.queryForList(...)
              - pattern: $T.queryForMap(...)
          - metavariable-regex:
              metavariable: "$T"
              regex: '.*([Jj]dbcTemplate|[Jj]dbcOperations|[Cc]lient)$'
      - pattern: $S.executeQuery(...)
      - patterns:
