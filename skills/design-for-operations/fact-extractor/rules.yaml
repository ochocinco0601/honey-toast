  # **Apache Camel: the component scheme in the URI is the fact kind.** A Camel route names
  # what it touches in the endpoint string, so one rule per kind with a scheme regex reads an
  # integration estate the way its author wrote it. `direct:` and `seda:` are deliberately
  # excluded from every rule below — they are in-process wiring between steps of the same
  # route, and on the reference estate they are the most common scheme by a wide margin
  # (68 of them). Counting those would report internal plumbing as service boundaries.
  #
  # Every rule below focuses the reported range on the URI. Without that, a match on `.to(...)`
  # in a fluent route is reported at the head of the chain, so an outbound fact cites the
  # `from(...)` line several lines above it — a citation that reads as plainly wrong to anyone
  # who opens it, in a method whose entire verification story is that a reader can open it.
  # Measured: every one of the 40 `.to(...)` facts on the reference estate cited
  # the wrong line before this was added.
  - id: dfo-java-camel-consume
    languages: [java]
    severity: INFO
    message: "message_consumer"
    metadata:
      fact_kind: message_consumer
      authored:
        estate: "apache/camel-spring-boot-examples"
