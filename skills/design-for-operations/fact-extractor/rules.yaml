  # ------------------------------------------------- TypeScript: durable state
  # Prisma, TypeORM and Mongoose in one pair of rules. **The receiver constraint carries the
  # whole precision burden**: `.find(` and `.create(` are ordinary JavaScript on arrays and
  # objects, and an unconstrained version of either rule reports a front end as a database.
  - id: dfo-js-durable-write
    languages: [javascript, typescript]
    severity: INFO
    message: "durable_write"
    metadata:
      fact_kind: durable_write
      authored:
        estate: "lujakob/nestjs-realworld-example-app, gothinkster/node-express-realworld-example-app"
        date: "2026-09-05"
        checked_against: "every match in both estates, opened at its cited line — TypeORM repositories and Prisma models"
      checked:
        - {"estate": "express-realworld", "date": "2026-09-05", "sampled": 6, "correct": 6, "pattern_sha": "3a17604a0dea"}
        - {"estate": "nestjs-realworld", "date": "2026-09-05", "sampled": 6, "correct": 6, "pattern_sha": "3a17604a0dea"}
    patterns:
      - pattern-either:
          - pattern: $R.save(...)
          - pattern: $R.insert(...)
          - pattern: $R.update(...)
          - pattern: $R.delete(...)
          - pattern: $R.remove(...)
          - pattern: $R.create(...)
          - pattern: $R.upsert(...)
      - metavariable-regex:
          metavariable: "$R"
          # The capitalised branch exists so a Sequelize model (`Order.create(...)`) is read.
          # A framework factory has exactly that shape: `NestFactory.create(ApplicationModule)`
          # boots an HTTP application, and was filed as a durable write. Factories, modules,
          # builders, apps and services are excluded by name — the widening that closed one gap
          # opened this one the same morning.
          regex: '.*([Rr]epository|[Rr]epo|[Mm]odel|[Mm]anager|[Dd]oc|[Dd]ocument|prisma\.[a-zA-Z]+)$|^(?!.*(Factory|Module|Builder|App|Service)$)[A-Z][A-Za-z0-9_]*$'

