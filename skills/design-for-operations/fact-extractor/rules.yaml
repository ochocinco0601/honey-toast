rules:
  # ---------------------------------------------------------------- inbound routes
  - id: dfo-java-inbound-route
    languages: [java]
    severity: INFO
    message: "inbound_route"
    metadata:
      fact_kind: inbound_route
      # Precision evidence. Each entry carries the fingerprint of the rule it
      # was drawn from; run.py discards any entry whose fingerprint no longer
      # matches, so editing a pattern voids its evidence mechanically.
      checked:
        - {"estate": "java-kafka", "date": "2026-09-05", "sampled": 3, "correct": 3, "pattern_sha": "e07f4ea32cbb"}
        - {"estate": "petclinic-micro", "date": "2026-09-05", "sampled": 6, "correct": 6, "pattern_sha": "e07f4ea32cbb"}
    # **A Feign client's methods carry the same annotations a controller's do.** Without this
    # exclusion an interface that CALLS three endpoints was recorded as SERVING them, which
    # inverts the edge on every dependency graph built from the fact base: the caller reads as
    # the provider. Verified against a probe carrying both — the exclusion removes
    # the client's methods and leaves the controller's. The client itself is a fact of its own,
    # in `dfo-java-feign-client`.
    patterns:
      - pattern-not-inside: |
          @FeignClient(...)
          interface $I { ... }
      # **A class-level `@RequestMapping` is a path PREFIX, not an endpoint.** It handles
      # nothing, and the methods under it are already reported one by one. Measured on the Kafka
      # estate: the rule reported four routes for a controller with three.
      #
      # The first attempt at this, `pattern-not` on the annotation-plus-class construct, did
      # nothing — the match being filtered is the annotation alone, not the construct containing
      # it, so the filter never applied. Verified against a probe carrying both placements: the
      # lookahead below excludes the class-level annotation and keeps the method-level one.
      - pattern-either:
          - pattern: "@GetMapping(...)"
          - pattern: "@PostMapping(...)"
          - pattern: "@PutMapping(...)"
          - pattern: "@DeleteMapping(...)"
          - pattern: "@PatchMapping(...)"
          - pattern-regex: '@RequestMapping\s*\([^)]*\)(?![\s\S]{0,80}?\bclass\b)'
          - pattern-regex: '@RequestMapping(?!\s*\()(?![\s\S]{0,80}?\bclass\b)' 

  - id: dfo-python-inbound-route
    languages: [python]
    severity: INFO
    message: "inbound_route"
    metadata:
      fact_kind: inbound_route
      checked:
        - {"estate": "bank-of-anthos", "date": "2026-09-02", "sampled": 6, "correct": 6, "pattern_sha": "21e740a5e2cf"}
        - {"estate": "microservices-demo", "date": "2026-09-02", "sampled": 1, "correct": 1, "pattern_sha": "21e740a5e2cf"}
    pattern-either:
      - pattern: "@$APP.route(...)"
      - pattern: "@$APP.get(...)"
      - pattern: "@$APP.post(...)"
      - pattern: "@$APP.put(...)"
      - pattern: "@$APP.delete(...)"
      - pattern: "@$APP.patch(...)"

  # C# attributes are matched WITHOUT their brackets, as call-like forms: `HttpGet(...)`
  # matches both `[HttpGet]` and `[HttpGet("{id}")]`. Two wrong forms were measured
  # against a real ASP.NET controller before this one: `[HttpGet]` matched
  # 0, and `[$A]` matched 6 things that were array indexing on entirely different lines —
  # a false positive that looked like a correct count. Verified: this form returns the 6
  # attribute lines the file actually has.
  - id: dfo-csharp-inbound-route
    languages: [csharp]
    severity: INFO
    message: "inbound_route"
    metadata:
      fact_kind: inbound_route
      # Precision evidence. `run.py` computes standing from these; one entry per
      # pass, written by `precision.py --record` from a worksheet an independent
      # reader judged. Scoring your own is the self-grading this replaced.
      checked:
        - {"estate": "eshop", "date": "2026-09-05", "sampled": 5, "correct": 5, "pattern_sha": "55941b23ded8"}
        # CLEARED: the pattern above changed after this evidence was
        # recorded, so the evidence describes a rule that no longer exists. Standing
        # does not survive a change to what the rule matches — carrying it forward
        # would report a narrowed rule as vouched-for on the strength of a sample
        # drawn from the broad one. Re-sample to earn it back.
    pattern-either:
      # Attribute style — MVC controllers.
      - pattern: "HttpGet(...)"
      - pattern: "HttpPost(...)"
      - pattern: "HttpPut(...)"
      - pattern: "HttpDelete(...)"
      - pattern: "HttpPatch(...)"
      - pattern: "Route(...)"
      # Minimal API style, and it is not a minority form: on the .NET reference
      # microservices application it declares 33 endpoints against the attribute
      # style's 14. Rules written only for controllers report a third of the surface
      # and look successful doing it (measured).
      - pattern: "$APP.MapGet(...)"
      - pattern: "$APP.MapPost(...)"
      - pattern: "$APP.MapPut(...)"
      - pattern: "$APP.MapDelete(...)"
      - pattern: "$APP.MapPatch(...)"
      # `$APP.MapGroup(...)` was REMOVED: a group declares a prefix and serves no
      # request. It produced three identical non-endpoint facts on one file, and the real
      # endpoints beneath it are captured by the Map* patterns above. Scored 1 of 2 before.

  # In an event-driven estate the business process crosses services on messages, not
  # HTTP. A handler is where one service picks up what another emitted, so it is a
  # boundary in exactly the sense signal placement cares about.
  - id: dfo-csharp-message-consumer
    languages: [csharp]
    severity: INFO
    message: "message_consumer"
    metadata:
      fact_kind: message_consumer
      # Precision evidence. `run.py` computes standing from these; one entry per
      # pass, written by `precision.py --record` from a worksheet an independent
      # reader judged. Scoring your own is the self-grading this replaced.
      checked:
        - {"estate": "eshop", "date": "2026-09-05", "sampled": 5, "correct": 5, "pattern_sha": "612c82671484"}
        # CLEARED: the pattern above changed after this evidence was
        # recorded, so the evidence describes a rule that no longer exists. Standing
        # does not survive a change to what the rule matches — carrying it forward
        # would report a narrowed rule as vouched-for on the strength of a sample
        # drawn from the broad one. Re-sample to earn it back.
    pattern-either:
      - pattern: "class $C : IIntegrationEventHandler<$E> { ... }"
      # IRequestHandler and INotificationHandler were REMOVED. They are MediatR:
      # in-process command and domain-event handlers. Nothing crosses a broker and nothing
      # arrives from another service, so they are not boundaries in the sense signal
      # placement cares about. Scored 1 of 2 before this.

  # ---------------------------------------------------------------- outbound calls
  # ------------------------------------------------- event seams (publisher / subscriber)
  # Added after the adapter showed that the recovered dependency graph for an
  # event-driven estate connects almost nothing. The join follows call sites and addresses;
  # on eShop that recovered TWO edges between eight deployables, while the business process
  # crosses all eight — six of eight nodes had no path to the subject, so their position
  # could not be derived. The stages are joined by events, and nothing extracted events.
  #
  # Prior art, from a blind check and a sourced literature search:
  # recovering WHICH service publishes and consumes which message is established practice.
  # Recovering the ORDER is not, and is not attempted here.
  - id: dfo-csharp-message-publisher
    languages: [csharp]
    severity: INFO
    message: "message_publisher"
    metadata:
      fact_kind: message_publisher
      provisional: true
      authored_on: eshop
      authored_date: 2026-09-02
      checked:
        - {"estate": "eshop", "date": "2026-09-05", "sampled": 6, "correct": 4, "pattern_sha": "e544074cdc9e"}
    # **Scored 0 of 5 by an independent reader, and rewritten.** The pattern
    # above matched `new SomethingIntegrationEvent(...)` — the CONSTRUCTION of an event object.
    # The reasoning recorded with it was that the publish call takes a variable and never names
    # the type, which is true; but the fact kind claims "this line sends a message", and
    # constructing does not send. In one sampled case the constructed event went to an outbox
    # and was never sent from that method at all. Identity-by-construction is the right trick
    # for a durable write's DIRECTION; it is the wrong trick for whether a send happened.
    #
    # **`SaveEventAndCatalogContextChangesAsync` was in this list for one round and removed.**
    # An independent read followed the call: it runs `SaveChangesAsync` plus an outbox-row
    # insert, and no broker dispatch happens on that path. It is a transactional-outbox WRITE
    # named as if it were a send — which is the same mistake as the pattern it replaced, made
    # from the other direction, and caught the same way. The outbox row is durable state; the
    # send is the next line.
    pattern-either:
      - pattern: $S.PublishThroughEventBusAsync(...)
      - pattern: $S.PublishAsync(...)

  # **Not a send, and it does not claim to be.** This is the other half of the seam the rule
  # above leaves open: the publisher rule matches where an event is SENT, and no send names a
  # type — measured on eShop 2026-09-07, every publish call site passes a variable, and the
  # probe fixture's own send passes a parameter typed with the base class. The type is only on
  # the line that bound the variable.
  #
  # So the binding is extracted as its own kind, with its own claim: "this variable holds an
  # event of this type here". `join.type_sent_at` pairs it with a send in the same file and
  # enclosing type, requires it to PRECEDE the send, and makes the edge cite both lines. A
  # binding with no send produces nothing, which is the ruling — constructing is not
  # sending — kept intact rather than quietly reversed.
  - id: dfo-csharp-event-binding
    languages: [csharp]
    severity: INFO
    message: "event_binding"
    metadata:
      fact_kind: event_binding
      provisional: true
      authored_on: probe
      authored_date: 2026-09-07
    # **The assignment form matches nothing and says nothing about it.** `var $V = new $T(...)`
    # and `$V = new $T(...)` both scored 0 against this fixture while
    # `new $T(...)` scored 6 — Semgrep's C# grammar does not take the binding as a pattern, and
    # returns no error for it. That is the precise failure `selftest.py` was written to catch,
    # met here while writing a rule to fix another instance of it.
    #
    # So the construction is matched and the variable is read off the cited line downstream:
    # `join.BOUND_TYPE` takes `NAME = new TYPE` out of the evidence text. A construction that
    # binds no variable — a cast, a ternary arm — yields a fact that pairs with nothing, which
    # is correct: there is no name for a send to have used.
    patterns:
      - pattern: new $T(...)
      - metavariable-regex:
          metavariable: "$T"
          regex: '^\w*IntegrationEvent$'

  # A DECLARATION, which is stronger than any call site: it names the event type and the
  # handler together, and it enumerates a population recall can be measured against.
  - id: dfo-csharp-message-subscription
    languages: [csharp]
    severity: INFO
    message: "message_subscription"
    metadata:
      fact_kind: message_subscription
      provisional: true
      authored_on: eshop
      authored_date: 2026-09-02
      checked:
        - {"estate": "eshop", "date": "2026-09-05", "sampled": 5, "correct": 5, "pattern_sha": "53ee3e6c7e24"}
    pattern-regex: "AddSubscription<\\s*(\\w+)\\s*,\\s*(\\w+)\\s*>"

  - id: dfo-java-outbound-http
    languages: [java]
    severity: INFO
    message: "outbound_http"
    metadata:
      fact_kind: outbound_http
      # Precision evidence. Each entry carries the fingerprint of the rule it
      # was drawn from; run.py discards any entry whose fingerprint no longer
      # matches, so editing a pattern voids its evidence mechanically.
      checked:
        - {"estate": "petclinic-micro", "date": "2026-09-05", "sampled": 5, "correct": 5, "pattern_sha": "9c0f49e2c91a"}
      # CLEARED along with the patterns. `WebClient.$M(...)` and
      # `HttpClient.$M(...)` were removed: they matched `WebClient.builder()`, a bean factory
      # returning a builder, which performs no request. On Spring PetClinic microservices
      # those two patterns produced every outbound fact in the run and both were wrong, while
      # every genuine cross-service call went unextracted.
    pattern-either:
      - pattern: "$R.exchange(...)"
      - pattern: "$R.getForObject(...)"
      - pattern: "$R.getForEntity(...)"
      - pattern: "$R.postForObject(...)"
      - pattern: "$R.postForEntity(...)"
      # The reactive and fluent clients — WebClient, RestClient — build a call as a chain and
      # the target is named at `.uri(...)`. **This is where a Spring estate's cross-service
      # calls actually live**, and none of them were extracted until this rule existed: measured on
      # Spring PetClinic microservices, the gateway's calls to the customers and visits
      # services were both invisible.
      #
      # Deliberately not constrained to a literal URL. Half the real calls on that subject
      # build the target from a field or a helper, and an extraction that only sees literals
      # reports the estate as having fewer calls rather than having less resolvable ones.
      # **Whether the target can be named is the join's question, not this rule's** — the
      # join emits an unresolved record naming the hop it could not follow.
      - pattern: "$R.uri(...)"

  - id: dfo-python-outbound-http
    languages: [python]
    severity: INFO
    message: "outbound_http"
    metadata:
      fact_kind: outbound_http
      checked:
        - {"estate": "camel-examples", "date": "2026-09-05", "sampled": 1, "correct": 1, "pattern_sha": "2f08ec0c225a"}
    pattern-either:
      - pattern: "requests.get(...)"
      - pattern: "requests.post(...)"
      - pattern: "requests.put(...)"
      - pattern: "requests.delete(...)"
      - pattern: "requests.patch(...)"
      - pattern: "httpx.$M(...)"

  - id: dfo-csharp-outbound-http
    languages: [csharp]
    severity: INFO
    message: "outbound_http"
    metadata:
      fact_kind: outbound_http
      # Precision evidence. `run.py` computes standing from these; one entry per
      # pass, written by `precision.py --record` from a worksheet an independent
      # reader judged. Scoring your own is the self-grading this replaced.
      checked:
        - {"estate": "eshop", "date": "2026-09-05", "sampled": 5, "correct": 5, "pattern_sha": "6b4f871273a5"}
        # CLEARED: the pattern above changed after this evidence was
        # recorded, so the evidence describes a rule that no longer exists. Standing
        # does not survive a change to what the rule matches — carrying it forward
        # would report a narrowed rule as vouched-for on the strength of a sample
        # drawn from the broad one. Re-sample to earn it back.
    # The receiver is constrained because the bare method name is not a network call:
    # `_orderRepository.GetAsync()` resolves to Entity Framework's FindAsync, and that one
    # evidence string recurred six times in the fact base. Scored 1 of 2 before this.
    # **The receiver constraint applies to the ambiguous verbs only, and a later pass narrowed
    # it to them.** The measured defect above was a repository's `GetAsync`, not a JSON helper:
    # `GetFromJsonAsync` and its siblings are extension methods defined on HttpClient and on
    # nothing else, so requiring the receiver to be *named* like a client only loses calls made
    # through a short parameter or a domain-named field. Measured: `c.GetFromJsonAsync(...)`
    # was invisible.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: "$C.GetAsync(...)"
              - pattern: "$C.PostAsync(...)"
              - pattern: "$C.PutAsync(...)"
              - pattern: "$C.DeleteAsync(...)"
              - pattern: "$C.SendAsync(...)"
          - metavariable-regex:
              metavariable: "$C"
              regex: "(?i).*(httpclient|http|client)$"
          # Added. System.Net.Http.Json extensions are the idiomatic form in this
          # estate and were entirely uncaught: 16 calls across WebApp, WebAppComponents and
          # HybridApp. In WebApp/Services/OrderingService.cs a SendAsync was a fact and a
          # GetFromJsonAsync on the same client in the same class was not.
      - pattern: "$C.GetFromJsonAsync(...)"
      - pattern: "$C.PostAsJsonAsync(...)"
      - pattern: "$C.PutAsJsonAsync(...)"
      - pattern: "$C.PatchAsJsonAsync(...)"
      - pattern: "$C.DeleteFromJsonAsync(...)"

  # A typed client registration: the class that receives the client, and the host it is
  # pointed at. **This is the hop that turns a call site into an edge.** An outbound call
  # names a method on a receiver and never names the service it reaches; the address lives
  # in composition-root registration, in a different file. Authored for the join.
  #
  # Deliberately broad. The type argument and the address are read from the cited source by
  # `join.py`, not captured here, because Semgrep's free engine redacts metavariable
  # bindings from its JSON output (`"lines": "requires login"`), which is the same reason
  # `run.py` reads the cited line from disk itself.
  - id: dfo-csharp-client-binding
    languages: [csharp]
    severity: INFO
    message: "client_binding"
    metadata:
      fact_kind: client_binding
      provisional: true
      authored:
        estate: "dotnet/eShop"
        date: "2026-09-01"
        checked_against: "the three typed-client registrations in WebApp and WebhookClient, opened at their cited lines"
      checked:
        - {"estate": "eshop", "date": "2026-09-05", "sampled": 5, "correct": 5, "pattern_sha": "194d15248a7e"}
    pattern-either:
      - pattern: $S.AddHttpClient<$T>(...)
      - pattern: $S.AddGrpcClient<$T>(...)

  # ---------------------------------------------------------------- Go
  #
  # **Authored because a run reported six of eleven deployables silent and the
  # reach check made that visible instead of leaving it to be noticed.** Four of the six are
  # Go, the parser reads Go, so this was a missing rule set rather than an estate out of
  # reach. Written from the idioms in the subject, each confirmed by opening its matches.
  #
  # Generated protobuf stubs are excluded everywhere below: they *define* the registration and
  # client constructors these rules match as calls, and counting a generated definition as an
  # entry point would inflate every Go estate by the size of its contract.
  - id: dfo-go-inbound-route
    languages: [go]
    severity: INFO
    message: "inbound_route"
    metadata:
      fact_kind: inbound_route
      provisional: true
      authored:
        estate: "GoogleCloudPlatform/microservices-demo"
        date: "2026-09-01"
        checked_against: "the frontend's route table and the gRPC server registrations, opened at their cited lines"
      checked: []
    paths:
      exclude: ["*genproto*", "*.pb.go"]
    pattern-either:
      - pattern: $R.HandleFunc($PATH, ...)
      - pattern: $R.Handle($PATH, ...)
      # `pb.RegisterCheckoutServiceServer(srv, svc)` — the point a service is mounted.
      # **The name is constrained by regex, not spelled with a metavariable inside it.**
      # `Register$XServer` parses and matches nothing: Semgrep binds a metavariable to a whole
      # identifier, never to part of one. It produced zero silently, which is the same
      # confidently-empty shape this tool exists to catch.
      - patterns:
          - pattern: $PB.$F(...)
          - metavariable-regex:
              metavariable: "$F"
              regex: '^Register\w+Server$'

  - id: dfo-go-grpc-method
    languages: [go]
    severity: INFO
    message: "grpc_method"
    metadata:
      fact_kind: grpc_method
      provisional: true
      authored:
        estate: "GoogleCloudPlatform/microservices-demo"
        date: "2026-09-01"
        checked_against: "the product catalog service's handlers, against its .proto"
      checked: []
    paths:
      exclude: ["*genproto*", "*.pb.go"]
    # The generated server interface's method shape. Narrower than it looks: an ordinary Go
    # method does not take a context and a request pointer and return a response pointer.
    pattern: |
      func ($R $T) $M(ctx context.Context, $REQ $RT) (*$RES, error) { ... }

  - id: dfo-go-outbound-http
    languages: [go]
    severity: INFO
    message: "outbound_http"
    metadata:
      fact_kind: outbound_http
      provisional: true
      authored:
        estate: "GoogleCloudPlatform/microservices-demo"
        date: "2026-09-01"
        checked_against: "the checkout service's six client constructions, opened at their cited lines"
      checked: []
    paths:
      exclude: ["*genproto*", "*.pb.go"]
    pattern-either:
      # `pb.NewCartServiceClient(conn)` — **the target service is in the type name**, which
      # makes this the join hop as well as the fact. Name constrained by regex for the same
      # reason as the server registration above.
      - patterns:
          - pattern: $PB.$F(...)
          - metavariable-regex:
              metavariable: "$F"
              regex: '^New\w+Client$'
      - pattern: $R.Get($URL, ...)
      - pattern: $R.Post($URL, ...)
      - pattern: $R.Do($REQ)

  - id: dfo-go-env-read
    languages: [go]
    severity: INFO
    message: "env_read"
    metadata:
      fact_kind: env_read
      provisional: true
      authored:
        estate: "GoogleCloudPlatform/microservices-demo"
        date: "2026-09-01"
        checked_against: "the frontend's startup configuration reads"
      checked: []
    paths:
      exclude: ["*genproto*", "*.pb.go"]
    pattern-either:
      - pattern: os.Getenv($K)
      - pattern: os.LookupEnv($K)

  # ---------------------------------------------------------------- JavaScript / Node
  #
  # Authored in the same pass as the Go rules, for the two remaining deployables the
  # reach check reported silent on the polyglot estate. Both are Node services; the parser
  # reads JavaScript, so this too was a missing rule rather than an estate out of reach.
  - id: dfo-js-inbound-route
    languages: [javascript, typescript]
    severity: INFO
    message: "inbound_route"
    metadata:
      fact_kind: inbound_route
      provisional: true
      authored:
        estate: "GoogleCloudPlatform/microservices-demo"
        date: "2026-09-01"
        checked_against: "the currency and payment services' gRPC service registrations, opened at their cited lines"
      checked:
        - {"estate": "express-realworld", "date": "2026-09-05", "sampled": 5, "correct": 5, "pattern_sha": "6ec4abeed22c"}
    pattern-either:
      # `server.addService(shopProto.CurrencyService.service, {...})` — a gRPC mount point.
      - pattern: $S.addService($SVC, ...)
      # Express and the routers built on it. **The receiver is constrained, and the first
      # version was not.** `$A.get($PATH, ...)` matched 124 Cypress selectors —
      # `cy.get('#create-account-btn')` — on the next estate it met, all of them filed as
      # inbound routes. A rule verified on one estate becomes a silent default on the next,
      # and what transfers is coverage rather than precision; this is that, caught by running
      # it somewhere else the same day. `.use` is dropped entirely: it mounts middleware as
      # often as a route and nothing in the call distinguishes them.
      - patterns:
          - pattern-either:
              - pattern: $A.get($PATH, ...)
              - pattern: $A.post($PATH, ...)
              - pattern: $A.put($PATH, ...)
              - pattern: $A.delete($PATH, ...)
          - metavariable-regex:
              metavariable: "$A"
              regex: '^(app|router|api|server|express|fastify|koaRouter|koa)$'

  - id: dfo-js-env-read
    languages: [javascript, typescript]
    severity: INFO
    message: "env_read"
    metadata:
      fact_kind: env_read
      provisional: true
      authored:
        estate: "GoogleCloudPlatform/microservices-demo"
        date: "2026-09-01"
        checked_against: "the currency service's startup configuration reads"
      checked:
        - {"estate": "angular-realworld", "date": "2026-09-05", "sampled": 1, "correct": 1, "pattern_sha": "4323fbcf6d0b"}
        - {"estate": "eshop", "date": "2026-09-05", "sampled": 5, "correct": 5, "pattern_sha": "4323fbcf6d0b"}
        - {"estate": "express-realworld", "date": "2026-09-05", "sampled": 5, "correct": 5, "pattern_sha": "4323fbcf6d0b"}
    pattern-either:
      - pattern: process.env.$K
      - pattern: process.env[$K]

  # ---------------------------------------------------------------- config / env reads

  # ------------------------------------------------- TypeScript: decorator frameworks
  # **Every decorator rule below is `pattern-regex`, and that is not a style choice.**
  # Measured on a NestJS estate: the AST pattern `@Get(...)` matched 0 of 21
  # decorators actually present, `@Get(...) $F(...) { ... }` matched 8 of 21, and the regex
  # matched 21 of 21. Semgrep does not error on a pattern form its TypeScript grammar cannot
  # use — it returns no matches — so an unsupported pattern and an estate that genuinely has
  # none are the same output. That silence is the reason `fixtures/` exists beside this file.
  - id: dfo-ts-decorator-route
    languages: [typescript]
    severity: INFO
    message: "inbound_route"
    metadata:
      fact_kind: inbound_route
      authored:
        estate: "lujakob/nestjs-realworld-example-app"
        date: "2026-09-05"
        checked_against: "every controller decorator in the estate, opened at its cited line"
      checked:
        - {"estate": "nestjs-realworld", "date": "2026-09-05", "sampled": 5, "correct": 5, "pattern_sha": "cdacd39bb8c8"}
    pattern-regex: '@(Get|Post|Put|Delete|Patch|All)\s*\('

  - id: dfo-ts-repo-decl
    languages: [typescript]
    severity: INFO
    message: "repo_decl"
    metadata:
      fact_kind: repo_decl
      authored:
        estate: "lujakob/nestjs-realworld-example-app"
        date: "2026-09-05"
        checked_against: "the TypeORM entity and injected-repository declarations"
      checked:
        - {"estate": "nestjs-realworld", "date": "2026-09-05", "sampled": 5, "correct": 5, "pattern_sha": "cb3c4307940b"}
    pattern-regex: '@(InjectRepository|Entity)\s*\('

  - id: dfo-ts-message-consumer
    languages: [typescript]
    severity: INFO
    message: "message_consumer"
    metadata:
