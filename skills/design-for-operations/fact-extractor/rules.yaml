  - id: dfo-java-env-read
    languages: [java]
    severity: INFO
    message: "env_read"
    metadata:
      fact_kind: env_read
      # Precision evidence. Each entry carries the fingerprint of the rule it
      # was drawn from; run.py discards any entry whose fingerprint no longer
      # matches, so editing a pattern voids its evidence mechanically.
      checked:
        - {"estate": "camel-examples", "date": "2026-09-05", "sampled": 5, "correct": 5, "pattern_sha": "b7c4d917e853"}
    pattern-either:
      - pattern: "System.getenv(...)"
      # `@Value(...)` bare matched `@Value("classpath:/static/index.html")` — a resource
      # bundled INSIDE the artifact, which is the boundary the C# round already drew:
      # env_read is the operating-system environment, set outside the artifact and
      # surviving no redeploy. Restricted to property placeholders, and POLL excluded so
      # a line is not emitted under both env_read and poll_interval — the same
      # double-kinding defect found in C# between env_read and config_ref.
      # Found 2026-09-02: PetClinic (the classpath resource) and Bank of Anthos
      # (3 lines carrying two kinds).
      #
      # OPEN, recorded rather than silently resolved: a `${...}` placeholder resolves
      # from Spring's Environment, which spans OS variables, JVM properties AND property
      # files. The cited line cannot say which. On Bank of Anthos the Kubernetes
      # manifests supply them, so env_read is right there; on an estate shipping
      # application.properties the same pattern would be config_ref.
      - patterns:
      # NB the placeholder must be CONTAINED, not equal to the whole value. A first
      # cut required equality and dropped `@Value("http://${BALANCES_API_ADDR}/balances")`
      # — a genuine env read carrying another service's address, which the join needs.
      # Caught by diffing what the fix removed, not only what it kept.
          - pattern: "@Value($V)"
          - metavariable-regex:
              metavariable: "$V"
              regex: "^\"(?!.*POLL).*\\$\\{.*\\}.*\"$"

