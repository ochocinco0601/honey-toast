      - pattern: "new Timer(...)"
      # A hosted background worker is a work-initiating entry point, not incidental
      # concurrency: in the .NET reference estate the grace-period stage of the
      # ordering business process runs entirely inside one, and the Task.Run / Timer
      # patterns matched none of them. (An earlier version of this comment claimed four such
      # classes exist; the fact base does not support that number and it is withdrawn.) Found by the
      # coverage check below flagging a service with durable writes and no entry
      # point.
      # Matched through the METHOD BODY, not the class declaration, and that is the lesson.
      # `class $C : BackgroundService { ... }` matches nothing here: these classes use primary
      # constructors, which the C# parser fails on, so the class header sits inside the unparsed
      # region while the body parses fine. **A partial parse loses the unparsed construct, not
      # the file** — a rule keyed on the failing construct misses, a rule keyed on anything else
      # in the same file succeeds. Measured, correcting an earlier belief that facts
      # in all 49 partially-parsed files were unrecoverable.
      # The method-level `ExecuteAsync` patterns were removed: a sampled match was
      # an override whose entire body is `return Task.CompletedTask`, which triggers nothing.
      # The class declaration is the honest unit, in `dfo-csharp-host-background`.
      # An IHostedService begins work in StartAsync, not ExecuteAsync. Added:
      # RabbitMQEventBus starts broker consumption there and was matched by nothing, which
      # left the estate's message ingress invisible.
      - pattern: "public Task StartAsync(CancellationToken $T) { ... }"
      - pattern: "public async Task StartAsync(CancellationToken $T) { ... }"

  # gRPC service methods are inbound entry points — in the .NET reference estate this is how the
  # web application reaches the basket service, and it is a business process seam. Keyed on the
  # ServerCallContext parameter, which is the signature marker, rather than on `override`, which
  # would match every override in the estate. Verified against the proto answer key: 3 declared,
  # 3 found.
  - id: dfo-csharp-grpc-method
    languages: [csharp]
    severity: INFO
    message: "inbound_route"
    metadata:
      fact_kind: inbound_route
      # Precision evidence. `run.py` computes standing from these; one entry per
      # pass, written by `precision.py --record` from a worksheet an independent
      # reader judged. Scoring your own is the self-grading this replaced.
      checked:
        - {"estate": "eshop", "date": "2026-09-05", "sampled": 3, "correct": 3, "pattern_sha": "c90d669f6989"}
        # CLEARED: the pattern above changed after this evidence was
        # recorded, so the evidence describes a rule that no longer exists. Standing
        # does not survive a change to what the rule matches — carrying it forward
        # would report a narrowed rule as vouched-for on the strength of a sample
        # drawn from the broad one. Re-sample to earn it back.
      # ---- PRECISION EVIDENCE — the only thing that gives a rule standing ----------------
      # `run.py` reads these lines and computes state from them: unchecked with none,
      # provisional while thin, established at 10 samples across 2 estates, quarantined the
      # moment `correct` is below `sampled`. There is no flag to set and nobody to ask.
      #
      # ONE ENTRY PER PRECISION PASS, exactly this form — strict JSON on one line, because
      # the reader is a line scanner and a YAML flow mapping with unquoted keys will not
      # parse:
      #   - checked: {"estate": "<name>", "date": "<YYYY-MM-DD>", "sampled": <n>, "correct": <n>}
      #
      # `sampled` and `correct` come from a reader judging `precision.py`'s worksheet — a
      # reader who did NOT author the rule. Appending an entry you scored yourself is the
      # self-grading this mechanism replaced.
      # Authored during the eShop run. Its 3 cited locations were opened and the
      # .proto reconciliation matched 3 of 3 — but that is a RECALL check against a declared
      # population, not a precision judgment by an independent reader, so it earns no entry
      # here and this rule is correctly still `unchecked`.
    pattern-either:
      - pattern: "$RET $M($REQ $R, ServerCallContext $CTX) { ... }"
      # The single-parameter form was REMOVED: it matched a two-line
      # claims-reading extension helper that merely takes a ServerCallContext. A gRPC service
      # method takes a request AND a context. Scored 1 of 2 before this.

  # ---------------------------------------------------------------- durable state
  - id: dfo-java-durable-write
    languages: [java]
    severity: INFO
    message: "durable_write"
    metadata:
      fact_kind: durable_write
      # Precision evidence. Each entry carries the fingerprint of the rule it
      # was drawn from; run.py discards any entry whose fingerprint no longer
      # matches, so editing a pattern voids its evidence mechanically.
      checked:
        - {"estate": "java-kafka", "date": "2026-09-05", "sampled": 6, "correct": 6, "pattern_sha": "4fd98bbd2f28"}
        - {"estate": "petclinic-micro", "date": "2026-09-05", "sampled": 4, "correct": 4, "pattern_sha": "4fd98bbd2f28"}
    # **The receiver is constrained, after two false positives of different
    # kinds.** `store.save(file)` wrote an in-memory vector store to a JVM temp file nothing
    # reads back — scratch, not durable state. And a Camel REST DSL `rest("/todos")...delete(...)`
    # was read as a database delete, which INVERTS it: that line declares an inbound endpoint.
    # That is the rule set's second inversion — the first was a Feign client read as a route —
    # and both have one shape: a declaration ABOUT an endpoint caught by a rule hunting an
    # ACTION. Naming a persistence receiver is what separates them.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: "$REPO.save(...)"
              - pattern: "$REPO.saveAll(...)"
              - pattern: "$REPO.delete(...)"
              - pattern: "$REPO.deleteById(...)"
          - metavariable-regex:
              metavariable: "$REPO"
              regex: '.*([Rr]epository|[Rr]epo|[Dd]ao|[Ss]ession|[Mm]apper)$'
      - pattern: "$EM.persist(...)"
      - pattern: "$EM.merge(...)"

  - id: dfo-python-durable-write
    languages: [python]
    severity: INFO
    message: "durable_write"
    metadata:
      fact_kind: durable_write
      checked:
        - {"estate": "bank-of-anthos", "date": "2026-09-02", "sampled": 2, "correct": 2, "pattern_sha": "65f9d999c15e"}
    pattern-either:
      - pattern: "$S.commit(...)"
      # `$CONN.execute($Q, ...)` was REMOVED. `conn.execute(statement)` runs the
      # statement it is handed and the call site cannot say which direction it goes: on Bank
      # of Anthos three of five sampled durable writes were SELECTs — `get_contacts`,
      # `get_user` and the uniqueness check inside `generate_accountid`. Direction lives in
      # how the statement was BUILT, so the constructors are matched instead. The citation
      # moves to the construction line, which also names the table.
      #
      # `$S.add(...)` was REMOVED in the same edit. It is receiver-blind — the same defect
      # the C# round cut `$SET.Add(...)` for. An ORM write still shows up: `$S.commit(...)`
      # is unambiguous, and it is the line where the write becomes durable.
      - pattern: "$T.insert()"
      - pattern: "$T.update()"
      - pattern: "$T.delete()"

  - id: dfo-csharp-durable-write
    languages: [csharp]
    severity: INFO
    message: "durable_write"
    metadata:
      fact_kind: durable_write
      # Precision evidence. `run.py` computes standing from these; one entry per
      # pass, written by `precision.py --record` from a worksheet an independent
      # reader judged. Scoring your own is the self-grading this replaced.
      checked:
        - {"estate": "eshop", "date": "2026-09-05", "sampled": 5, "correct": 5, "pattern_sha": "93450b0183ad"}
        # CLEARED: the pattern above changed after this evidence was
        # recorded, so the evidence describes a rule that no longer exists. Standing
        # does not survive a change to what the rule matches — carrying it forward
        # would report a narrowed rule as vouched-for on the strength of a sample
        # drawn from the broad one. Re-sample to earn it back.
    pattern-either:
      - pattern: "$CTX.SaveChanges(...)"
      - pattern: "$CTX.SaveChangesAsync(...)"
      # `$SET.Add(...)` and `$SET.Remove(...)` were REMOVED after scoring 0 of 2:
      # both draws were in-memory appends — a TypeInfoResolverChain and a local List<Claim>.
      # Semgrep cannot tell a DbSet from a List without type resolution, so no narrowing of
      # the receiver saves it. SaveChanges is the unambiguous signal and costs recall on
      # tracked-entity writes, which is the correct trade: an inflated business process map
      # puts monitoring on things that do not exist.

  # Broad on the method name, narrow on the receiver.
  # metavariable-regex keeps the receiver AST-resolved while allowing the
  # open-ended Spring Data method vocabulary (findByX, getAllByY, ...).
  - id: dfo-java-durable-read
    languages: [java]
    severity: INFO
    message: "durable_read"
    metadata:
      fact_kind: durable_read
      # Precision evidence. Each entry carries the fingerprint of the rule it
      # was drawn from; run.py discards any entry whose fingerprint no longer
      # matches, so editing a pattern voids its evidence mechanically.
      checked:
        - {"estate": "camel-examples", "date": "2026-09-05", "sampled": 1, "correct": 0, "pattern_sha": "6fa6b9e854ae"}
        - {"estate": "java-kafka", "date": "2026-09-05", "sampled": 4, "correct": 4, "pattern_sha": "6fa6b9e854ae"}
        - {"estate": "petclinic-micro", "date": "2026-09-05", "sampled": 6, "correct": 6, "pattern_sha": "6fa6b9e854ae"}
    patterns:
      - pattern: "$REPO.$M(...)"
      - metavariable-regex:
          metavariable: "$M"
          # `get\\w*By\\w*` matched `json.getBytes()` — "get" + "" + "By" + "tes".
          # A Spring Data derived query always capitalises the property after `By`
          # (`getByName`, `getOwnerById`), so requiring a capital excludes the English
          # word "Bytes" without excluding any real query.
          # Found in the PetClinic sample.
          regex: "^(find\\w*|latest\\w*|count\\w*|exists\\w*|get\\w*By[A-Z]\\w*)$"

  # A repository field declaration binds a field NAME to a repository TYPE. Call sites
  # name the field; only the declaration names the type, and the type is what two
  # services share when one writes what the other polls. This is the join key.
  # Python had NO durable_read rule until this one. Every Python read of durable state
  # was therefore either invisible or, worse, counted as a WRITE by the direction-blind
  # `execute()` pattern above. A missing rule and a wrong one produced the same wrong
  # picture from two directions.
      # **The receiver is constrained too.** The method-name regex alone
      # matched a `ConcurrentHashMap` field read, and a hand-rolled class carrying Spring's
      # `@Repository` stereotype whose backing store is an `ArrayList` filled at
      # `@PostConstruct`. The second is the hard one and this does not fix it: type name,
      # annotation and method name all say durable, and only the field's initialisation says
      # otherwise. A line-scoped rule cannot see that; the bound is stated, not papered over.
      - metavariable-regex:
          metavariable: "$REPO"
          regex: '.*([Rr]epository|[Rr]epo|[Dd]ao|[Ss]ession|[Mm]apper|[Tt]emplate)$'

  - id: dfo-python-durable-read
    languages: [python]
    severity: INFO
    message: "durable_read"
    metadata:
      fact_kind: durable_read
      checked:
        - {"estate": "bank-of-anthos", "date": "2026-09-02", "sampled": 3, "correct": 3, "pattern_sha": "f2a8c5279895"}
    pattern-either:
      - pattern: "$T.select()"
      - pattern: "$S.query(...)"


  # ================================================================ durable state, by driver
  # **The named data stores get read directly, not only through an ORM.** Enterprise estates
  # commonly run MSSQL, Oracle, PostgreSQL and MongoDB, and a large share of the code that
  # touches them does so through a raw driver or a micro-ORM rather than through Spring Data
  # or EF Core. A rule set that only reads the ORMs reports those services as stateless.
  #
  # Every rule here is constrained on the receiver or the method name. `execute` and `query`
  # are among the most overloaded identifiers in any codebase, and an unconstrained version of
  # any of these would report a front end as a database.

  - id: dfo-java-jdbc-read
