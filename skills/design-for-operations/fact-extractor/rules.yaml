        # does not survive a change to what the rule matches — carrying it forward
        # would report a narrowed rule as vouched-for on the strength of a sample
        # drawn from the broad one. Re-sample to earn it back.
    pattern-either:
      - pattern: "$CTX.SaveChanges(...)"
      - pattern: "$CTX.SaveChangesAsync(...)"
      # `$SET.Add(...)` and `$SET.Remove(...)` were REMOVED 2026-09-01 after scoring 0 of 2:
      # both draws were in-memory appends — a TypeInfoResolverChain and a local List<Claim>.
      # Semgrep cannot tell a DbSet from a List without type resolution, so no narrowing of
      # the receiver saves it. SaveChanges is the unambiguous signal and costs recall on
      # tracked-entity writes, which is the correct trade: an inflated business process map
      # puts monitoring on things that do not exist.

  # Broad on the method name, narrow on the receiver — the same reasoning the script
  # carried. metavariable-regex keeps the receiver AST-resolved while allowing the
  # open-ended Spring Data method vocabulary (findByX, getAllByY, ...).
  - id: dfo-java-durable-read
    languages: [java]
    severity: INFO
    message: "durable_read"
    metadata:
      fact_kind: durable_read
      # Precision evidence. Each entry carries the fingerprint of the rule it
      # was drawn from; run.py discards any entry whose fingerprint no longer
      # matches, so editing a pattern voids its evidence mechanically.
      checked:
        - {"estate": "petclinic", "date": "2026-09-02", "sampled": 6, "correct": 6, "pattern_sha": "b71a84a7fb64"}
        - {"estate": "bank-of-anthos", "date": "2026-09-02", "sampled": 6, "correct": 6, "pattern_sha": "b71a84a7fb64"}
    patterns:
      - pattern: "$REPO.$M(...)"
      - metavariable-regex:
          metavariable: "$M"
          # `get\\w*By\\w*` matched `json.getBytes()` — "get" + "" + "By" + "tes".
          # A Spring Data derived query always capitalises the property after `By`
          # (`getByName`, `getOwnerById`), so requiring a capital excludes the English
          # word "Bytes" without excluding any real query.
          # Found 2026-09-02, PetClinic sample.
          regex: "^(find\\w*|latest\\w*|count\\w*|exists\\w*|get\\w*By[A-Z]\\w*)$"

  # A repository field declaration binds a field NAME to a repository TYPE. Call sites
  # name the field; only the declaration names the type, and the type is what two
  # services share when one writes what the other polls. This is the join key.
  # Python had NO durable_read rule until 2026-09-02. Every Python read of durable state
  # was therefore either invisible or, worse, counted as a WRITE by the direction-blind
  # `execute()` pattern above. A missing rule and a wrong one produced the same wrong
  # picture from two directions.
  - id: dfo-python-durable-read
    languages: [python]
    severity: INFO
    message: "durable_read"
    metadata:
      fact_kind: durable_read
      checked:
        - {"estate": "bank-of-anthos", "date": "2026-09-02", "sampled": 3, "correct": 3, "pattern_sha": "f2a8c5279895"}
    pattern-either:
      - pattern: "$T.select()"
      - pattern: "$S.query(...)"

