  - id: dfo-python-durable-write
    languages: [python]
    severity: INFO
    message: "durable_write"
    metadata:
      fact_kind: durable_write
      checked:
        - {"estate": "bank-of-anthos", "date": "2026-09-02", "sampled": 2, "correct": 2, "pattern_sha": "65f9d999c15e"}
    pattern-either:
      - pattern: "$S.commit(...)"
      # `$CONN.execute($Q, ...)` was REMOVED 2026-09-02. `conn.execute(statement)` runs the
      # statement it is handed and the call site cannot say which direction it goes: on Bank
      # of Anthos three of five sampled durable writes were SELECTs — `get_contacts`,
      # `get_user` and the uniqueness check inside `generate_accountid`. Direction lives in
      # how the statement was BUILT, so the constructors are matched instead. The citation
      # moves to the construction line, which also names the table.
      #
      # `$S.add(...)` was REMOVED in the same edit. It is receiver-blind — the same defect
      # the C# round cut `$SET.Add(...)` for. An ORM write still shows up: `$S.commit(...)`
      # is unambiguous, and it is the line where the write becomes durable.
      - pattern: "$T.insert()"
      - pattern: "$T.update()"
      - pattern: "$T.delete()"

