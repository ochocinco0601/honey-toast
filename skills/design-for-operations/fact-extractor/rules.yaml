  - id: dfo-csharp-ado-write
    languages: [csharp]
    severity: INFO
    message: "durable_write"
    metadata:
      fact_kind: durable_write
      # Raw ADO.NET against MSSQL.
      authored: {estate: "fixtures — probe idioms", date: "2026-09-05", checked_against: "probe fixtures only"}
      checked: []
    # **`Execute` and `ExecuteAsync` are constrained; `ExecuteNonQuery` is not.** The latter
    # exists only on a database command. The former are the two most overloaded verbs in .NET:
    # measured on the reference estate, an unconstrained version filed an MVVM `Command.Execute`,
    # a Polly resilience `_pipeline.Execute` and three EF Core `strategy.ExecuteAsync` retry
    # wrappers as database writes — six of eight matches wrong. Naming a connection is what
    # makes Dapper's spelling of this a database fact.
    pattern-either:
      - pattern: $C.ExecuteNonQuery(...)
      - pattern: $C.ExecuteNonQueryAsync(...)
      - patterns:
          - pattern-either:
              - pattern: $C.ExecuteAsync(...)
              - pattern: $C.Execute(...)
          - metavariable-regex:
              metavariable: "$C"
              regex: '.*([Cc]onnection|[Cc]onn|[Dd]atabase|db)$'

