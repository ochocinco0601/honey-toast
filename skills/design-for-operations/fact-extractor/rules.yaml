        checked_against: "the matched endpoint URIs, opened at their cited lines"
      checked:
        - {"estate": "camel-examples", "date": "2026-09-05", "sampled": 5, "correct": 5, "pattern_sha": "62672ab8f8f0"}
    patterns:
      - pattern: from($URI)
      - focus-metavariable: "$URI"
      - metavariable-regex:
          metavariable: "$URI"
          regex: '^"(kafka|jms|amqp|activemq|rabbitmq|spring-rabbitmq|paho|paho-mqtt5|sjms|sjms2|aws2-sqs|google-pubsub|pulsar|nats):.*"$'

