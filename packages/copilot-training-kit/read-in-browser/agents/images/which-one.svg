ard" x="394" y="130" width="64" height="34" rx="6"/><text class="dg-t" x="406" y="152" style="font-size:14px">request</text></g><text class="dg-x-cap" x="242" y="188">A request that matches it</text><text class="dg-tb" x="484" y="16" style="font-size:14px">A custom agent</text><text class="dg-x-cap" x="484" y="34">One role for a whole chat</text><rect class="dg-x-hit" x="514" y="48" width="160" height="40" rx="6"/><text class="dg-tb" x="526" y="73" style="font-size:14px">A custom agent</text><path class="dg-x-arrow" d="M594 88L594 106L520 106L520 122"/><path class="dg-x-head" d="M515 122L520 130L525 122Z"/><rect class="dg-x-req" x="488" y="130" width="64" height="34" rx="6"/><text class="dg-t" x="500" y="152" style="font-size:14px">request</text><path class="dg-x-arrow" d="M594 88L594 106L594 106L594 122"/><path class="dg-x-head" d="M589 122L594 130L599 122Z"/><rect class="dg-x-req" x="562" y="130" width="64" height="34" rx="6"/><text class="dg-t" x="574" y="152" style="font-size:14px">request</text><path class="dg-x-arrow" d="M594 88L594 106L668 106L668 122"/><path class="dg-x-head" d="M663 122L668 130L673 122Z"/><rect class="dg-x-req" x="636" y="130" width="64" height="34" rx="6"/><text class="dg-t" x="648" y="152" style="font-size:14px">request</text><text class="dg-x-cap" x="484" y="188">Every request while it&#x27;s selected</text>
