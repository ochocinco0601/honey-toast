<text class="dg-tb" x="0" y="16" style="font-size:14px">Asked not to change a file</text><text class="dg-x-cap" x="0" y="34">by a request, custom instructions or a skill</text><rect class="dg-x-req" x="0" y="70" width="110" height="48" rx="6"/><text class="dg-tb" x="12" y="99" style="font-size:14px">Copilot</text><path class="dg-x-arrow" d="M110 94L130 94L130 64L156 64"/><path class="dg-x-head" d="M156 59L164 64L156 69Z"/><path class="dg-x-arrow" d="M110 94L130 94L130 124L156 124"/><path class="dg-x-head" d="M156 119L164 124L156 129Z"/><rect class="dg-x-card" x="164" y="46" width="150" height="36" rx="6"/><text class="dg-t" x="176" y="69" style="font-size:14px">Read files</text><rect class="dg-x-hit" x="164" y="106" width="150" height="36" rx="6"/><text class="dg-tb" x="176" y="129" style="font-size:14px">Change files</text><text class="dg-x-cap" x="0" y="172">Still has the tool. It can change the file.</text><text class="dg-tb" x="368" y="16" style="font-size:14px">A custom agent</text><text class="dg-x-cap" x="368" y="34">given only the tools for reading files</text><rect class="dg-x-req" x="368" y="70" width="110" height="48" rx="6"/><text class="dg-tb" x="380" y="99" style="font-size:14px">Copilot</text><path class="dg-x-arrow" d="M478 94L498 94L498 64L524 64"/><path class="dg-x-head" d="M524 59L532 64L524 69Z"/><rect class="dg-x-card" x="532" y="46" width="150" height="36" rx="6"/><text class="dg-t" x="544" y="69" style="font-size:14px">Read files</text><g class="dg-x-dim"><rect class="dg-x-card" x="532" y="106" width="150" height="36" rx="6"/><text class="dg-t" x="544" y="129" style="font-size:14px">Change files</text></g><text class="dg-x-cap" x="368" y="172">Doesn&#x27;t have the tool. It can&#x27;t change the file.</text>
